name: Make Summary CSV

on:
  schedule:
    - cron: '20 15 * * *'   # 毎日 00:20 JST（GitHubの混雑で数十分遅れることがある）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: make-summary
  cancel-in-progress: false

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas openpyxl

      - name: Make summary CSV
        run: |
          python make_summary.py
          python make_excel.py

      - name: Commit and push summary
        env:
          TZ: Asia/Tokyo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add summary/
          if git diff --staged --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "Update summary $(date '+%Y-%m-%d %H:%M JST')"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}" && exit 0
            echo "push failed (${i}), retrying"
            sleep 10
          done
          exit 1
